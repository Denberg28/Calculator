name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source and metadata
        run: python3 scripts/check_source.py
      - name: Build and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source and metadata
        run: python scripts/check_source.py
      - name: Build Windows x64 portable executable
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test arithmetic and real Windows UI
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package and validate extracted executable
        shell: powershell
        run: ./scripts/package.ps1 -BuildDir build
      - name: Upload package and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Calculator-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/package-build.json
            build/ui-smoke.png
            ui-smoke.png
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-failure-evidence
          path: |
            build/Testing/Temporary/
            build/ui-smoke.png
          retention-days: 7

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [core, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Calculator-windows-x64
          path: release-assets
      - name: Publish verified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          version="$(cat VERSION)"
          RELEASE_TAG="v$version"
          if [ "$TRIGGER_REF_TYPE" = tag ]; then test "$TRIGGER_REF_NAME" = "$RELEASE_TAG"; fi
          case "$version" in *-rc.*) ;; *) echo 'Stable promotion blocked pending manual desktop validation'; exit 1;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release $RELEASE_TAG retained; bump VERSION to publish another candidate."
            exit 0
          fi
          cd release-assets/dist
          sha256sum --check SHA256SUMS.txt
          cd ../..
          cat > release-notes.md <<EOF
          Native, offline Windows x64 basic calculator: arithmetic, decimals, negatives, parentheses, keyboard/mouse input and clear error recovery.

          **Test candidate $version.** Windows automated build, arithmetic/state tests, UI smoke and packaged executable validation passed. Linux sanitizer tests passed. [Build and test evidence]($RUN_URL).

          Source: $SOURCE_SHA. Download the Windows ZIP, extract it, and run Calculator.exe. No administrator rights or extra runtime required. Unsigned. Verify SHA256SUMS.txt.

          Manual Windows 10/11 checks for physical input, clipboard, DPI/multi-monitor and accessibility remain NOT TESTED and block stable promotion. See included docs/TESTING.md. Floating-point results show 15 significant digits; no persistent history.

          Upgrade: extract into a separate folder. Rollback: close and reopen a retained prior version. First release has no prior stable baseline. Delete the folder to uninstall.
          EOF
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease --title "Calculator $version — Windows x64 test candidate" --notes-file release-notes.md release-assets/dist/*.zip release-assets/dist/SHA256SUMS.txt release-assets/dist/package-build.json release-assets/build/ui-smoke.png
